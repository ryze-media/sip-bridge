[from-sipgate]
exten => _X.,1,NoOp(Call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(normalize-e164,s,1(${EXTEN}))
 same => n,Set(NORMALIZED_DIALED_NUMBER=${GOSUB_RETVAL})
 same => n,Gosub(normalize-e164,s,1(${CALLERID(num)}))
 same => n,Set(NORMALIZED_CALLER_NUMBER=${GOSUB_RETVAL})
 same => n,Set(CALLERID(num)=${NORMALIZED_CALLER_NUMBER})
 same => n,NoOp(Forwarding normalized call: ${NORMALIZED_CALLER_NUMBER} -> ${NORMALIZED_DIALED_NUMBER})
 same => n,Dial(PJSIP/${NORMALIZED_DIALED_NUMBER}@livekit,60)
 same => n,Hangup()

[from-livekit]
exten => _X.,1,Hangup()

[normalize-e164]
exten => s,1,Set(NUMBER=${FILTER(0-9+,${ARG1})})
 same => n,GotoIf($["${NUMBER}" = ""]?done)
 same => n,GotoIf($["${NUMBER:0:1}" = "+"]?done)
 same => n,GotoIf($["${NUMBER:0:2}" = "00"]?international)
 same => n,GotoIf($["${NUMBER:0:1}" = "0"]?national)
 same => n,Set(NUMBER=+${NUMBER})
 same => n,Goto(done)
 same => n(international),Set(NUMBER=+${NUMBER:2})
 same => n,Goto(done)
 same => n(national),Set(NUMBER=+${DEFAULT_COUNTRY_CODE}${NUMBER:1})
 same => n(done),Return(${NUMBER})
