services:
  asterisk:
    build: .
    container_name: sip-bridge
    restart: unless-stopped
    init: true
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP:?EXTERNAL_IP is required}
      SIPGATE_USER: ${SIPGATE_USER:?SIPGATE_USER is required}
      SIPGATE_PASS: ${SIPGATE_PASS:?SIPGATE_PASS is required}
      LIVEKIT_SIP_HOST: ${LIVEKIT_SIP_HOST:?LIVEKIT_SIP_HOST is required}
      LIVEKIT_SIP_PORT: ${LIVEKIT_SIP_PORT:-5060}
      LIVEKIT_SIP_TRANSPORT: ${LIVEKIT_SIP_TRANSPORT:-tcp}
      LIVEKIT_SIP_USER: ${LIVEKIT_SIP_USER:?LIVEKIT_SIP_USER is required}
      LIVEKIT_SIP_PASS: ${LIVEKIT_SIP_PASS:?LIVEKIT_SIP_PASS is required}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-49}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
